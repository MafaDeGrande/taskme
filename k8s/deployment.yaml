apiVersion: apps/v1
kind: Deployment
metadata:
  name: medi
  labels:
    app.kubernetes.io/name: medi
    app.kubernetes.io/component: api
spec:
  replicas: ${DEPLOYMENT_REPLICAS}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medi
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medi
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: medi
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        workload: application
        iam.gke.io/gke-metadata-server-enabled: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: medi
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: medi
              app.kubernetes.io/component: api
      containers:
        - name: medi
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: medi-config
          env:
            - name: DB_CREDENTIALS_FILE
              value: /var/run/secrets/medi/credentials.json
          volumeMounts:
            - name: db-credentials
              mountPath: /var/run/secrets/medi
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: db-credentials
          secret:
            secretName: medi-db-credentials
            items:
              - key: credentials.json
                path: credentials.json
